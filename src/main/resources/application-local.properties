# 로컬 개발 프로필 (docker-compose.yml과 함께 사용, 실제 인프라·비밀값 없음)
# 실행: docker compose up -d && ./gradlew bootRun --args='--spring.profiles.active=local'

# DB: docker MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/humming?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
spring.datasource.username=humming
spring.datasource.password=humming
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT (로컬 전용 값, HS512 서명에 필요한 64바이트 이상)
jwt.secret=FB2N71nqpE9Xv4zXUBhJ0RL7WU2aqdoJq2uQIa4sjWiT9t/cMPDGuH3T6doFgBrIkcNPdMgTperIcui8DW1aiA==
jwt.access-token-expiration-in-milliseconds=1800000
jwt.refresh-token-expiration-in-milliseconds=604800000

# AI 서버: docker 가짜 AI 서버
ai.base-url=http://localhost:8000
ai.connect-timeout-ms=3000
ai.response-timeout-sec=60
ai.callback-secret=local-callback-secret

# S3: docker S3Mock (인증 정보는 검증하지 않음)
aws.s3.endpoint=http://localhost:9090
spring.cloud.aws.region.static=ap-northeast-2
spring.cloud.aws.region.auto=false
spring.cloud.aws.stack.auto=false
spring.cloud.aws.credentials.access-key=local
spring.cloud.aws.credentials.secret-key=local
spring.cloud.aws.s3.bucket=humming-local

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

server.callback-host=localhost
server.port=8080

logging.level.com.capstone.HummingService=INFO
